services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pig
      POSTGRES_PASSWORD: pig_password
      POSTGRES_DB: pig_monitoring
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "15432:5432"
    restart: unless-stopped

volumes:
  pg_data:
