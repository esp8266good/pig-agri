[project]
name = "pig-monitoring"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pyzmq>=26",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "opencv-python-headless>=4.9",
    "aiofiles>=23",
    "torchvision>=0.26.0",
    "thop>=0.1.1.post2209072238",
    "pycocotools>=2.0.11",
    "tabulate>=0.10.0",
    "matplotlib>=3.10.9",
    "yacs>=0.1.8",
    "termcolor>=3.3.0",
    "portalocker>=3.2.0",
    "iopath>=0.1.10",
    "fvcore>=0.1.5.post20221221",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "einops>=0.8.2",
    "timm>=1.0.26",
    "scikit-learn>=1.8.0",
    "faiss-cpu>=1.13.2",
    "tensorboard>=2.20.0",
    "lapx>=0.9.4",
    "filterpy>=1.4.5",
    "markdown-it-py>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "flask>=3.1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
