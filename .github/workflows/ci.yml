name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, X64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pig
          POSTGRES_PASSWORD: pig_password
          POSTGRES_DB: pig_monitoring
        ports:
          - 15432:5432
        volumes:
          - ./sql:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pig:pig_password@localhost:15432/pig_monitoring

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run core test suite
        run: >-
          uv run pytest
          tests/test_alerts_router.py
          tests/test_analysis_scheduler.py
          tests/test_config.py
          tests/test_database.py
          tests/test_db_writer.py
          tests/test_hls_manager.py
          tests/test_hls_retention.py
          tests/test_storage_monitor.py
          tests/test_vod_generator.py
          -q
