<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豬隻監測 Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..600&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens ─────────────────────────────────────── */
    :root {
      --font-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;

      --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
      --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
      --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
      --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);

      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem;    --space-6: 1.5rem; --space-8: 2rem;

      --radius-sm: 0.375rem; --radius-md: 0.5rem;
      --radius-lg: 0.75rem;  --radius-full: 9999px;

      --transition: 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Dark palette (monitor/CCTV dashboard 風格) ─────────── */
    :root {
      --bg:           #0d0d0f;
      --surface:      #141416;
      --surface-2:    #1a1a1d;
      --surface-3:    #222226;
      --border:       rgba(255,255,255,0.08);
      --divider:      rgba(255,255,255,0.05);

      --text:         #e8e8ea;
      --text-muted:   #8a8a90;
      --text-faint:   #4a4a52;

      --accent:       #22bb77;   /* 綠色 — live 狀態 */
      --accent-dim:   rgba(34,187,119,0.15);
      --accent-hover: #1da868;

      --thermal:      #ff8c42;   /* 熱成像橘 */
      --thermal-dim:  rgba(255,140,66,0.15);

      --error:        #e05252;
      --error-dim:    rgba(224,82,82,0.15);
      --warning:      #e0a030;

      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
    }

    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--text);
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-6) var(--space-4);
      gap: var(--space-4);
    }
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
    select { font: inherit; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 840px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }
    .logo-mark {
      width: 28px; height: 28px;
      color: var(--accent);
    }
    .logo-text {
      font-size: var(--text-base);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    /* ── Controls ───────────────────────────────────────────── */
    .controls {
      width: 100%;
      max-width: 840px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .control-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .cam-select {
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: border-color var(--transition);
      min-width: 120px;
    }
    .cam-select:hover { border-color: rgba(255,255,255,0.18); }

    /* ── Toggle button group ────────────────────────────────── */
    .type-toggle {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 2px;
    }
    .type-btn {
      padding: var(--space-1) var(--space-4);
      border-radius: calc(var(--radius-md) - 2px);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
      white-space: nowrap;
    }
    .type-btn:hover:not(.active) { color: var(--text); }
    .type-btn.active[data-type="rgb"] {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .type-btn.active[data-type="thermal"] {
      background: var(--thermal-dim);
      color: var(--thermal);
    }

    /* ── Video card ─────────────────────────────────────────── */
    .video-card {
      width: 100%;
      max-width: 840px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    #video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%; height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* 初始化時的 skeleton shimmer */
    .video-skeleton {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms;
      z-index: 2;
    }
    .video-skeleton.visible { opacity: 1; }
    .skeleton-pulse {
      width: 40px; height: 40px;
      border-radius: var(--radius-full);
      border: 2px solid var(--text-faint);
      border-top-color: var(--text-muted);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Video footer bar ───────────────────────────────────── */
    .video-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--divider);
      background: var(--surface-2);
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    /* ── Status pill ────────────────────────────────────────── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-3);
      border: 1px solid var(--border);
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .status-pill.live {
      color: var(--accent);
      background: var(--accent-dim);
      border-color: rgba(34,187,119,0.25);
    }
    .status-pill.error {
      color: var(--error);
      background: var(--error-dim);
      border-color: rgba(224,82,82,0.25);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status-pill.live .status-dot {
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── Stats chips ─────────────────────────────────────────── */
    .stats-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .stat-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .stat-chip strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── WS reconnect toast ─────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-xs);
      color: var(--text-muted);
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms, transform 200ms;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: var(--space-4) var(--space-3); gap: var(--space-3); }
      .stats-row { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Timeline ──────────────────────────────────────────── */
    #timeline-section {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    #week-nav {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .week-nav-btn {
      padding: var(--space-1) var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: var(--text-sm);
      transition: background var(--transition);
    }
    .week-nav-btn:hover:not(:disabled) { background: var(--surface-3); }
    .week-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #week-label {
      flex: 1;
      text-align: center;
      font-size: var(--text-sm);
      color: var(--text-muted);
    }
    #live-btn {
      padding: var(--space-1) var(--space-3);
      background: var(--accent);
      border-radius: var(--radius-full);
      border: none;
      color: #000;
      font-weight: 600;
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    #timeline-bar {
      display: flex;
      width: 100%;
      height: 24px;
      background: var(--surface-2);
      border-radius: var(--radius-md);
      overflow: hidden;
      gap: 1px;
    }
    .timeline-slot {
      flex: 1;
      background: var(--surface-3);
    }
    .timeline-slot.has-data {
      background: var(--accent-dim);
      cursor: pointer;
      transition: background var(--transition);
    }
    .timeline-slot.has-data:hover { background: rgba(34,187,119,0.35); }
    .timeline-slot.selected { background: var(--accent); }
    .status-pill.vod {
      color: var(--warning);
      background: rgba(224,160,48,0.15);
      border-color: rgba(224,160,48,0.3);
    }

    /* ── Transport / scrubber bar ───────────────────────────── */
    .transport {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4);
      background: var(--surface-2);
      border-top: 1px solid var(--divider);
      font-variant-numeric: tabular-nums;
    }
    .transport-play {
      width: 30px; height: 30px;
      flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: var(--radius-full);
      background: var(--surface-3);
      color: var(--text);
      font-size: 0.78rem;
      line-height: 1;
      transition: background var(--transition);
    }
    .transport-play:hover { background: rgba(255,255,255,0.12); }
    .transport-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      min-width: 42px;
      text-align: center;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .transport-track {
      position: relative;
      flex: 1;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .transport-track::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      border-radius: var(--radius-full);
      background: var(--surface-3);
    }
    .transport-buffered {
      position: absolute;
      left: 0; height: 4px; width: 0;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.14);
      pointer-events: none;
    }
    .transport-progress {
      position: absolute;
      left: 0; height: 4px; width: 0;
      border-radius: var(--radius-full);
      background: var(--accent);
      pointer-events: none;
      transition: background var(--transition);
    }
    .transport.is-vod .transport-progress { background: var(--warning); }
    .transport-handle {
      position: absolute;
      left: 0;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      transform: translateX(-50%);
      box-shadow: 0 1px 5px rgba(0,0,0,0.55);
      pointer-events: none;
      transition: width 120ms, height 120ms, border-color var(--transition);
    }
    .transport.is-vod .transport-handle { border-color: var(--warning); }
    .transport-track:hover .transport-handle,
    .transport-track.dragging .transport-handle { width: 16px; height: 16px; }
    .transport-live-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
    }
    .transport-live-btn[data-state="at-edge"] {
      background: var(--accent-dim);
      color: var(--accent);
      cursor: default;
      box-shadow: 0 0 0 1px rgba(34,187,119,0.3), 0 0 14px rgba(34,187,119,0.22);
    }
    .transport-live-btn[data-state="at-edge"] .transport-live-dot {
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    .transport-live-btn[data-state="behind"],
    .transport-live-btn[data-state="vod"] {
      background: var(--surface-3);
      color: var(--text);
    }
    .transport-live-btn[data-state="behind"]:hover,
    .transport-live-btn[data-state="vod"]:hover { background: var(--accent); color: #000; }
    .transport-live-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    @media (max-width: 480px) {
      .transport-time { min-width: 34px; font-size: 0.66rem; }
      .transport-live-btn { padding: var(--space-1) var(--space-2); font-size: 0.62rem; }
    }

    /* ── Bell badge ─────────────────────────────────────────── */
    #bell-btn {
      margin-left: auto;
      padding: var(--space-2) var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--space-1);
      transition: background var(--transition);
    }
    #bell-btn:hover { background: var(--surface-3); }
    #bell-badge {
      background: var(--error);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: var(--radius-full);
      min-width: 16px;
      text-align: center;
    }

    /* ── Bottom panel ──────────────────────────────────────── */
    #bottom-panel {
      width: 100%;
      max-width: 840px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    #tab-bar {
      display: flex;
      border-bottom: 1px solid var(--divider);
      background: var(--surface-2);
    }
    .tab-btn {
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      border-right: 1px solid var(--divider);
      transition: color var(--transition), background var(--transition);
    }
    .tab-btn:hover:not(.active) { color: var(--text); }
    .tab-btn.active { color: var(--accent); background: var(--accent-dim); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Pig status table ───────────────────────────────────── */
    #pig-status-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-xs);
    }
    #pig-status-table th {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--divider);
      background: var(--surface-2);
    }
    #pig-status-table td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--divider);
      color: var(--text);
    }
    .anomaly-row td { background: var(--error-dim); }
    .anomaly-cell { color: var(--error); font-weight: 600; }
    .pig-empty-msg { color: var(--text-faint); font-style: italic; padding: var(--space-3); }

    /* ── Notifications ──────────────────────────────────────── */
    #alert-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
    }
    .alert-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      transition: background var(--transition);
      gap: var(--space-3);
    }
    .alert-item:hover { background: var(--surface-2); }
    .alert-item.unread { border-left: 3px solid var(--error); }
    .alert-info { display: flex; align-items: center; gap: var(--space-3); flex: 1; flex-wrap: wrap; }
    .alert-cam  { font-weight: 600; color: var(--text); font-size: var(--text-xs); }
    .alert-metric { color: var(--error); font-size: var(--text-xs); }
    .alert-time { color: var(--text-faint); font-size: var(--text-xs); }
    .alert-sigma { color: var(--text-muted); font-size: var(--text-xs); }
    .mark-read-btn {
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      color: var(--text-muted);
      background: var(--surface-2);
      flex-shrink: 0;
      white-space: nowrap;
      cursor: pointer;
    }
    .mark-read-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .mark-read-btn:disabled { opacity: 0.4; cursor: default; }
    .notif-empty { color: var(--text-faint); font-style: italic; padding: var(--space-3); text-align: center; }
    /* ── Settings tab ───────────────────────────────────────── */
    #tab-settings { padding: var(--space-3) var(--space-4); }
    .settings-form { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-5); }
    .settings-field { display: flex; flex-direction: column; gap: var(--space-1); }
    .settings-field label { font-size: var(--text-xs); font-weight: 500; color: var(--text-muted); }
    .settings-field input, .settings-field select {
      padding: var(--space-1) var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      color: var(--text);
      width: 100%;
    }
    .settings-field input:focus, .settings-field select:focus {
      outline: none; border-color: var(--accent);
    }
    .settings-save-row { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-3); }
    #save-settings-btn {
      padding: var(--space-1) var(--space-4);
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
    }
    #save-settings-btn:hover { opacity: 0.85; }
    #settings-status { font-size: var(--text-xs); color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 28 28" fill="none" aria-label="豬隻監測系統">
        <!-- 豬鼻輪廓 SVG logo -->
        <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="1.5"/>
        <ellipse cx="14" cy="15" rx="6" ry="5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="11.5" cy="15" r="1.5" fill="currentColor"/>
        <circle cx="16.5" cy="15" r="1.5" fill="currentColor"/>
        <path d="M9 9.5 C9 7.5 11 6 11 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M19 9.5 C19 7.5 17 6 17 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">豬隻監測 Live</span>
    </div>
    <button id="bell-btn" onclick="switchTab('notifications'); document.getElementById('bottom-panel').scrollIntoView({behavior:'smooth'})" aria-label="通知中心">
      🔔 <span id="bell-badge" style="display:none">0</span>
    </button>
  </header>

  <!-- Controls -->
  <div class="controls" role="toolbar" aria-label="串流控制">
    <div class="control-group">
      <label class="control-label" for="cam-select">Camera</label>
      <select id="cam-select" class="cam-select" aria-label="選擇攝影機"></select>
    </div>
    <div class="type-toggle" role="group" aria-label="影像類型">
      <button class="type-btn active" id="btn-rgb" data-type="rgb"
              onclick="setType('rgb')" aria-pressed="true">RGB</button>
      <button class="type-btn" id="btn-thermal" data-type="thermal"
              onclick="setType('thermal')" aria-pressed="false">Thermal</button>
    </div>
  </div>

  <!-- Video card -->
  <div class="video-card">
    <div id="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div class="video-skeleton visible" id="skeleton" aria-hidden="true">
        <div class="skeleton-pulse"></div>
      </div>
    </div>

    <!-- Transport / scrubber -->
    <div class="transport" id="transport">
      <button class="transport-play" id="play-btn" aria-label="播放或暫停" title="播放 / 暫停">⏸</button>
      <span class="transport-time" id="time-cur" title="">LIVE</span>
      <div class="transport-track" id="seek-track" role="slider" tabindex="0"
           aria-label="播放進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="transport-buffered" id="seek-buffered"></div>
        <div class="transport-progress" id="seek-progress"></div>
        <div class="transport-handle" id="seek-handle"></div>
      </div>
      <span class="transport-time" id="time-dur">LIVE</span>
      <button class="transport-live-btn" id="transport-live-btn" data-state="at-edge"
              onclick="onLiveBtnClick()">
        <span class="transport-live-dot"></span><span id="transport-live-label">LIVE</span>
      </button>
    </div>

    <!-- Footer bar -->
    <div class="video-footer">
      <div id="status" class="status-pill" aria-live="polite" aria-atomic="true">
        <span class="status-dot"></span>
        <span id="status-text">初始化中...</span>
      </div>
      <div class="stats-row">
        <div class="stat-chip">
          豬隻：<strong id="count-badge">—</strong>
        </div>
        <div class="stat-chip" id="latency-chip" style="display:none">
          延遲：<strong id="latency-val">—</strong> ms
        </div>
      </div>
    </div>
  </div>

  <!-- Timeline -->
  <div id="timeline-section">
    <div id="week-nav">
      <button class="week-nav-btn" id="prev-week-btn" onclick="prevWeek()" aria-label="上一週">&#8249;</button>
      <span id="week-label"></span>
      <button class="week-nav-btn" id="next-week-btn" onclick="nextWeek()" aria-label="下一週">&#8250;</button>
      <button id="live-btn" onclick="switchToLive()" style="display:none">● Live</button>
    </div>
    <div id="timeline-bar" role="list" aria-label="時間軸（每格代表一小時）"></div>
  </div>

  <!-- WS reconnect toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Bottom panel: 豬隻狀態 / 通知中心 -->
  <div id="bottom-panel">
    <div id="tab-bar">
      <button class="tab-btn active" data-tab="pig-status"
              onclick="switchTab('pig-status')">豬隻狀態</button>
      <button class="tab-btn" data-tab="notifications"
              onclick="switchTab('notifications')">通知中心</button>
      <button class="tab-btn" data-tab="settings"
              onclick="switchTab('settings')">設定</button>
    </div>

    <div id="tab-pig-status" class="tab-content active">
      <table id="pig-status-table">
        <thead>
          <tr><th>豬隻</th><th>活動量</th><th>體溫</th></tr>
        </thead>
        <tbody id="pig-status-body"></tbody>
      </table>
    </div>

    <div id="tab-notifications" class="tab-content">
      <ul id="alert-list"></ul>
    </div>

    <div id="tab-settings" class="tab-content">
      <div class="settings-form">
        <div class="settings-field">
          <label for="set-jpeg-quality">影像壓縮品質（50–95）</label>
          <input type="number" id="set-jpeg-quality" min="50" max="95" step="1">
        </div>
        <div class="settings-field">
          <label for="set-analysis-interval">分析間隔（分鐘）</label>
          <select id="set-analysis-interval">
            <option value="15">15 分鐘</option>
            <option value="30">30 分鐘</option>
            <option value="60">60 分鐘</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="set-anomaly-threshold">異常閾值（σ，≥ 1.0）</label>
          <input type="number" id="set-anomaly-threshold" min="1.0" step="0.1">
        </div>
        <div class="settings-field">
          <label for="set-hls-retention">影像保留天數（1–365）</label>
          <input type="number" id="set-hls-retention" min="1" max="365" step="1">
        </div>
        <div class="settings-save-row">
          <button id="save-settings-btn" onclick="saveSettings()">儲存設定</button>
          <span id="settings-status"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // ── State ─────────────────────────────────────────────────
    let hls = null;
    let ws = null;
    let wsGeneration = 0;   // increment on every connectWS; onclose checks this
    let wsRetryTimer = null;
    let wsRetryCount = 0;
    const MAX_WS_RETRY = 5;
    const WS_RETRY_BASE_MS = 2000;

    let latestBoxes = [];
    let vodStartTs = 0;
    let bboxHistory = [];   // live mode: [{ts, boxes}] ring buffer for HLS latency alignment
    let currentCamera = null;
    let currentType = 'rgb';
    let animFrameId = null;
    let isLive = true;
    let currentWeekStart = null;   // 本週週一 00:00:00 UTC 的 Unix 秒
    let vodDebounceTimer = null;
    let vodFetching = false;   // prevent overlapping VOD tracking requests
    let anomalyMap = {};           // { object_id: { activity_anomaly, temp_anomaly, ... } }
    let vodAlerts = [];            // VOD 模式下的歷史 alerts
    let liveAnomalyIntervalId = null;
    let currentObjectIds = new Set();  // 最近一次 WS frame 出現的 object_id

    // ── Transport / scrubber state ────────────────────────────
    let transportDragging = false;
    let dragFrac = 0;
    let seekCommitTimer = null;
    let dragSeekPending = false;
    let trackingFetchTimer = null;
    let trackingCache = new Map();   // VOD: "cam|0.5s-bucket" -> boxes[]

    // ── DOM refs ──────────────────────────────────────────────
    const video     = document.getElementById('video');
    const camSelect = document.getElementById('cam-select');
    const statusEl  = document.getElementById('status');
    const statusTxt = document.getElementById('status-text');
    const skeleton  = document.getElementById('skeleton');
    const countBadge = document.getElementById('count-badge');
    const latencyChip = document.getElementById('latency-chip');
    const latencyVal  = document.getElementById('latency-val');
    const toastEl   = document.getElementById('toast');
    const liveBtn        = document.getElementById('live-btn');
    const prevWeekBtn    = document.getElementById('prev-week-btn');
    const nextWeekBtn    = document.getElementById('next-week-btn');
    const weekLabelEl    = document.getElementById('week-label');
    const timelineBar    = document.getElementById('timeline-bar');
    const bellBadge      = document.getElementById('bell-badge');
    const pigStatusBody  = document.getElementById('pig-status-body');
    const alertListEl    = document.getElementById('alert-list');
    const transportEl    = document.getElementById('transport');
    const playBtn        = document.getElementById('play-btn');
    const timeCurEl      = document.getElementById('time-cur');
    const timeDurEl      = document.getElementById('time-dur');
    const seekTrack      = document.getElementById('seek-track');
    const seekBuffered   = document.getElementById('seek-buffered');
    const seekProgress   = document.getElementById('seek-progress');
    const seekHandle     = document.getElementById('seek-handle');
    const liveBtnT       = document.getElementById('transport-live-btn');
    const liveLabelT     = document.getElementById('transport-live-label');

    // ── Status helpers ────────────────────────────────────────
    function setStatus(msg, cls = '') {
      statusTxt.textContent = msg;
      statusEl.className = 'status-pill' + (cls ? ' ' + cls : '');
    }

    let toastTimer = null;
    function showToast(msg, duration = 3000) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function setSkeleton(visible) {
      skeleton.classList.toggle('visible', visible);
    }

    // ── Timeline helpers ──────────────────────────────────────
    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getUTCDay();               // 0=Sun, 1=Mon...
      const diff = day === 0 ? -6 : 1 - day;  // 距離週一的天數
      d.setUTCDate(d.getUTCDate() + diff);
      d.setUTCHours(0, 0, 0, 0);
      return d.getTime() / 1000;
    }

    function formatWeekLabel(weekStartTs) {
      const s = new Date(weekStartTs * 1000);
      const e = new Date((weekStartTs + 6 * 86400) * 1000);
      const pad = n => String(n).padStart(2, '0');
      const startStr = `${pad(s.getUTCMonth()+1)}/${pad(s.getUTCDate())}`;
      const endStr   = `${pad(e.getUTCMonth()+1)}/${pad(e.getUTCDate())}`;
      return `${s.getUTCFullYear()}年${s.getUTCMonth()+1}月 ${startStr} – ${endStr}`;
    }

    function updateWeekNavButtons() {
      const nowWeekStart = getWeekStart(new Date());
      const minWeekStart = getWeekStart(new Date(Date.now() - 90 * 86400 * 1000));
      prevWeekBtn.disabled = currentWeekStart <= minWeekStart;
      nextWeekBtn.disabled = currentWeekStart >= nowWeekStart;
      weekLabelEl.textContent = formatWeekLabel(currentWeekStart);
    }

    function prevWeek() {
      currentWeekStart -= 7 * 86400;
      updateWeekNavButtons();
      loadTimeline();
    }

    function nextWeek() {
      currentWeekStart += 7 * 86400;
      updateWeekNavButtons();
      loadTimeline();
    }

    async function loadTimeline() {
      if (!currentCamera || !currentWeekStart) return;
      const startTs = currentWeekStart;
      const endTs   = currentWeekStart + 7 * 24 * 3600;
      try {
        const resp = await fetch(`/stream/${currentCamera}/timeline?start_ts=${startTs}&end_ts=${endTs}`);
        if (!resp.ok) return;
        const { hours } = await resp.json();
        renderTimeline(hours);
      } catch (_) {}
    }

    function renderTimeline(hours) {
      timelineBar.innerHTML = '';
      const hourSet = new Set(hours);
      for (let i = 0; i < 168; i++) {
        const slotTs = currentWeekStart + i * 3600;
        const hasData = hourSet.has(slotTs);
        const slot = document.createElement('div');
        slot.className = 'timeline-slot' + (hasData ? ' has-data' : '');
        slot.setAttribute('role', 'listitem');
        slot.title = new Date(slotTs * 1000).toLocaleString('zh-TW');
        if (hasData) {
          slot.addEventListener('click', () => {
            document.querySelectorAll('.timeline-slot.selected')
              .forEach(s => s.classList.remove('selected'));
            slot.classList.add('selected');
            loadVod(slotTs);
          });
        }
        timelineBar.appendChild(slot);
      }
    }

    // ── VOD mode ──────────────────────────────────────────────
    function loadVod(startTs) {
      isLive = false;
      vodStartTs = startTs;
      vodFetching = false;
      bboxHistory = [];
      liveBtn.style.display = '';
      latestBoxes = [];
      countBadge.textContent = '—';
      latencyChip.style.display = 'none';
      clearTimeout(vodDebounceTimer);
      clearInterval(liveAnomalyIntervalId);
      liveAnomalyIntervalId = null;
      anomalyMap = {};
      vodAlerts  = [];
      currentObjectIds.clear();
      trackingCache.clear();
      transportDragging = false;
      seekTrack.classList.remove('dragging');
      clearTimeout(trackingFetchTimer);

      // 抓此 VOD 時段的歷史 alerts（含前 30 分鐘）
      const vodEnd = startTs + 3600;
      fetch(`/alerts?camera_id=${currentCamera}&start_ts=${startTs - 1800}&end_ts=${vodEnd + 300}`)
        .then(r => r.json())
        .then(data => { vodAlerts = data.alerts || []; })
        .catch(() => {});

      // 斷開 WS（不重連）
      clearTimeout(wsRetryTimer);
      wsGeneration++;
      if (ws) { ws.close(); ws = null; }

      detachVodListeners();
      if (hls) { hls.destroy(); hls = null; }
      video.src = '';
      setSkeleton(true);
      setStatus('載入回放...', '');

      const vodUrl = `/stream/${currentCamera}/vod?start=${startTs}&end=${startTs + 3600}&type=${currentType}`;

      if (Hls.isSupported()) {
        hls = new Hls({ lowLatencyMode: false, backBufferLength: 0 });
        hls.loadSource(vodUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          setSkeleton(false);
          const dt = new Date(startTs * 1000);
          const label = dt.toLocaleString('zh-TW', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit',
          });
          setStatus(`回放中 ${label}`, 'vod');
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            setSkeleton(false);
            setStatus(`回放錯誤：${data.details}`, 'error');
          }
        });

        attachVodListeners();
      }
    }

    function switchToLive() {
      if (isLive) return;
      isLive = true;
      liveBtn.style.display = 'none';
      detachVodListeners();
      clearTimeout(vodDebounceTimer);
      clearTimeout(trackingFetchTimer);
      trackingCache.clear();
      transportDragging = false;
      seekTrack.classList.remove('dragging');
      clearInterval(liveAnomalyIntervalId);
      anomalyMap = {};
      vodAlerts  = [];
      latestBoxes = [];
      bboxHistory = [];
      currentObjectIds.clear();
      document.querySelectorAll('.timeline-slot.selected')
        .forEach(s => s.classList.remove('selected'));
      wsRetryCount = 0;
      loadStream();
      liveAnomalyIntervalId = setInterval(refreshAnomalyMap, 30000);
      refreshAnomalyMap();
      refreshNotifications();
    }

    // ── Historical MOT overlay (VOD) ──────────────────────────
    function onVodTimeUpdate() { scheduleTrackingFetch(false); }
    function onVodSeeking()    { scheduleTrackingFetch(false); }
    function onVodSeeked()     { scheduleTrackingFetch(true); }
    function attachVodListeners() {
      video.addEventListener('timeupdate', onVodTimeUpdate);
      video.addEventListener('seeking',   onVodSeeking);
      video.addEventListener('seeked',    onVodSeeked);
    }
    function detachVodListeners() {
      video.removeEventListener('timeupdate', onVodTimeUpdate);
      video.removeEventListener('seeking',   onVodSeeking);
      video.removeEventListener('seeked',    onVodSeeked);
    }

    // Fetch the tracking frame nearest the current VOD playhead and draw it.
    // Debounced 100ms by default; pass immediate=true on discrete seeks.
    // A small LRU cache keyed by 0.5s buckets avoids re-fetching while scrubbing.
    function scheduleTrackingFetch(immediate = false) {
      if (isLive || !hls || !currentCamera) return;
      clearTimeout(trackingFetchTimer);
      const run = async () => {
        // vodStartTs + video.currentTime is more reliable than hls.playingDate
        // which can be null for VOD streams in some hls.js versions.
        const ts = vodStartTs + (video.currentTime || 0);
        if (!ts) return;
        const key = currentCamera + '|' + Math.round(ts * 2);
        if (trackingCache.has(key)) { applyVodBoxes(trackingCache.get(key), ts); return; }
        if (vodFetching) { trackingFetchTimer = setTimeout(run, 60); return; }
        vodFetching = true;
        try {
          const resp = await fetch(`/tracking/${currentCamera}?start=${ts - 2}&end=${ts + 2}`);
          if (resp.ok) {
            const boxes = pickClosestFrame((await resp.json()).logs || [], ts);
            trackingCache.set(key, boxes);
            if (trackingCache.size > 400) trackingCache.delete(trackingCache.keys().next().value);
            applyVodBoxes(boxes, ts);
          }
        } catch (_) {}
        vodFetching = false;
      };
      if (immediate) run(); else trackingFetchTimer = setTimeout(run, 100);
    }

    function applyVodBoxes(boxes, ts) {
      latestBoxes = boxes;
      countBadge.textContent = boxes.length;
      currentObjectIds = new Set(boxes.map(o => o.object_id));
      updateVodAnomalyMap(ts);
    }

    function pickClosestFrame(logs, ts) {
      if (!logs.length) return [];
      const byFrame = new Map();
      for (const log of logs) {
        if (!byFrame.has(log.frame_id)) byFrame.set(log.frame_id, []);
        byFrame.get(log.frame_id).push(log);
      }
      let bestFrame = null, bestDist = Infinity;
      for (const [, frameLogs] of byFrame) {
        const dist = Math.abs(frameLogs[0].timestamp - ts);
        if (dist < bestDist) { bestDist = dist; bestFrame = frameLogs; }
      }
      return bestFrame || [];
    }

    // ── Anomaly map ───────────────────────────────────────────
    async function refreshAnomalyMap() {
      if (!currentCamera) return;
      try {
        const data = await fetch(`/alerts/active?camera_id=${currentCamera}`).then(r => r.json());
        const camCache = data.cache?.[currentCamera] ?? {};
        anomalyMap = {};
        for (const [oid, info] of Object.entries(camCache)) {
          anomalyMap[parseInt(oid)] = info;
        }
        renderPigStatus();
      } catch (_) {}
    }

    function updateVodAnomalyMap(currentTs) {
      anomalyMap = {};
      for (const alert of vodAlerts) {
        const winStart = alert.triggered_at_unix - 1800;
        const winEnd   = alert.triggered_at_unix;
        if (currentTs >= winStart && currentTs <= winEnd) {
          const entry = anomalyMap[alert.object_id] ?? { activity_anomaly: false, temp_anomaly: false };
          if (alert.metric === 'activity')    entry.activity_anomaly = true;
          if (alert.metric === 'temperature') entry.temp_anomaly = true;
          anomalyMap[alert.object_id] = entry;
        }
      }
      renderPigStatus();
    }

    // ── Tab panel ─────────────────────────────────────────────
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });
      document.querySelectorAll('.tab-content').forEach(c => {
        c.classList.toggle('active', c.id === `tab-${tabName}`);
      });
    }

    function renderPigStatus() {
      if (!pigStatusBody) return;
      pigStatusBody.innerHTML = '';
      if (currentObjectIds.size === 0) {
        pigStatusBody.innerHTML =
          '<tr><td colspan="3" class="pig-empty-msg">目前無偵測到豬隻</td></tr>';
        return;
      }
      for (const oid of currentObjectIds) {
        const a = anomalyMap[oid] ?? null;
        const actAnomaly  = a?.activity_anomaly ?? false;
        const tempAnomaly = a?.temp_anomaly ?? false;
        const actVal  = a?.activity_current != null ? a.activity_current.toFixed(1) : '—';
        const tempVal = a?.temp_current != null ? a.temp_current.toFixed(1) : '—';
        const row = document.createElement('tr');
        if (actAnomaly || tempAnomaly) row.classList.add('anomaly-row');
        row.innerHTML = `
          <td>#${oid}</td>
          <td class="${actAnomaly ? 'anomaly-cell' : ''}">
            ${actAnomaly ? '⚠ ' : ''}${actVal}
          </td>
          <td class="${tempAnomaly ? 'anomaly-cell' : ''}">
            ${tempAnomaly ? '🌡 ' : ''}${tempVal}
          </td>`;
        pigStatusBody.appendChild(row);
      }
    }

    function renderNotifications(alerts) {
      if (!alertListEl) return;
      alertListEl.innerHTML = '';
      if (!alerts.length) {
        alertListEl.innerHTML = '<li class="notif-empty">目前無警示記錄</li>';
        return;
      }
      for (const alert of alerts) {
        const dt = new Date(alert.triggered_at_unix * 1000)
          .toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',
                                    hour:'2-digit',minute:'2-digit'});
        const sigma = alert.std_value > 0
          ? ((alert.current_value - alert.mean_value) / alert.std_value).toFixed(1)
          : '—';
        const metricLabel = alert.metric === 'activity' ? '活動量偏低' : '體溫異常';
        const li = document.createElement('li');
        li.className = 'alert-item' + (alert.is_read ? '' : ' unread');
        li.innerHTML = `
          <div class="alert-info">
            <span class="alert-cam">${alert.camera_id} #${alert.object_id}</span>
            <span class="alert-metric">${metricLabel}</span>
            <span class="alert-time">${dt}</span>
            <span class="alert-sigma">偏差 ${sigma}σ</span>
          </div>
          <button class="mark-read-btn"
                  onclick="markAlertRead(${alert.id}, this)"
                  ${alert.is_read ? 'disabled' : ''}>
            ${alert.is_read ? '已讀' : '標記已讀'}
          </button>`;
        li.addEventListener('click', e => {
          if (e.target.classList.contains('mark-read-btn')) return;
          if (alert.camera_id !== currentCamera) {
            camSelect.value = alert.camera_id;
            currentCamera = alert.camera_id;
          }
          loadVod(alert.triggered_at_unix - 1800);
        });
        alertListEl.appendChild(li);
      }
    }

    async function markAlertRead(alertId, btn) {
      try {
        await fetch(`/alerts/${alertId}/read`, { method: 'PUT' });
        btn.textContent = '已讀';
        btn.disabled = true;
        btn.closest('.alert-item').classList.remove('unread');
        const d = await fetch('/alerts?unread_only=true').then(r => r.json());
        const n = (d.alerts || []).length;
        bellBadge.textContent = n;
        bellBadge.style.display = n > 0 ? '' : 'none';
      } catch (_) {}
    }

    async function refreshNotifications() {
      if (!currentCamera) return;
      try {
        const d = await fetch(`/alerts?camera_id=${currentCamera}&limit=50`)
          .then(r => r.json());
        renderNotifications(d.alerts || []);
        const ud = await fetch('/alerts?unread_only=true').then(r => r.json());
        const n = (ud.alerts || []).length;
        bellBadge.textContent = n;
        bellBadge.style.display = n > 0 ? '' : 'none';
      } catch (_) {}
    }

    // ── Settings ──────────────────────────────────────────────
    async function loadSettings() {
      try {
        const resp = await fetch('/settings');
        if (!resp.ok) return;
        const data = await resp.json();
        const q = document.getElementById('set-jpeg-quality');
        const a = document.getElementById('set-analysis-interval');
        const t = document.getElementById('set-anomaly-threshold');
        const r = document.getElementById('set-hls-retention');
        if (q && data.jpeg_quality !== undefined)              q.value = data.jpeg_quality;
        if (a && data.analysis_interval_minutes !== undefined) a.value = data.analysis_interval_minutes;
        if (t && data.anomaly_std_threshold !== undefined)     t.value = data.anomaly_std_threshold;
        if (r && data.hls_retention_days !== undefined)        r.value = data.hls_retention_days;
      } catch (_) {}
    }

    async function saveSettings() {
      const body = {
        jpeg_quality:              document.getElementById('set-jpeg-quality').value,
        analysis_interval_minutes: document.getElementById('set-analysis-interval').value,
        anomaly_std_threshold:     document.getElementById('set-anomaly-threshold').value,
        hls_retention_days:        document.getElementById('set-hls-retention').value,
      };
      const statusEl = document.getElementById('settings-status');
      try {
        const resp = await fetch('/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (resp.ok) {
          statusEl.textContent = '✓ 已儲存';
          setTimeout(() => { statusEl.textContent = ''; }, 3000);
        } else {
          const err = await resp.json();
          statusEl.textContent = `✗ ${err.detail || '儲存失敗'}`;
        }
      } catch (e) {
        statusEl.textContent = `✗ 網路錯誤`;
      }
    }

    // ── Type toggle ───────────────────────────────────────────
    function setType(type) {
      currentType = type;
      const btnRgb     = document.getElementById('btn-rgb');
      const btnThermal = document.getElementById('btn-thermal');
      btnRgb.classList.toggle('active', type === 'rgb');
      btnThermal.classList.toggle('active', type === 'thermal');
      btnRgb.setAttribute('aria-pressed', type === 'rgb');
      btnThermal.setAttribute('aria-pressed', type === 'thermal');
      if (!isLive) {
        switchToLive();
      } else {
        loadStream();
      }
    }

    // ── WebSocket (tracking) with auto-reconnect ──────────────
    function connectWS(cameraId) {
      clearTimeout(wsRetryTimer);
      if (ws) { ws.close(); ws = null; }
      if (!cameraId) return;

      const gen = ++wsGeneration;  // each call gets a unique generation token
      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const url = `${wsProtocol}//${location.host}/ws/tracking/${cameraId}`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        if (gen !== wsGeneration) return;
        wsRetryCount = 0;
      };

      ws.onmessage = (e) => {
        if (gen !== wsGeneration) return;  // stale connection, discard
        try {
          const data = JSON.parse(e.data);
          latestBoxes = data.objects || [];
          countBadge.textContent = latestBoxes.length;
          currentObjectIds = new Set(latestBoxes.map(o => o.object_id));
          renderPigStatus();
          if (data.timestamp) {
            const delay = Date.now() - data.timestamp * 1000;
            latencyChip.style.display = '';
            latencyVal.textContent = Math.round(delay);
            // Buffer bbox with timestamp for HLS live latency alignment.
            // Keep enough history to cover the HLS back-buffer (~90s) so
            // scrubbing back in live mode still has matching boxes.
            bboxHistory.push({ ts: data.timestamp, boxes: latestBoxes });
            if (bboxHistory.length > 1000) bboxHistory.shift();
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        // If gen no longer matches, this close was intentional (camera switched).
        // Do NOT reconnect — that would fight the new connection.
        if (gen !== wsGeneration) return;
        latestBoxes = [];
        countBadge.textContent = '—';
        if (wsRetryCount < MAX_WS_RETRY) {
          const delay = WS_RETRY_BASE_MS * Math.pow(1.5, wsRetryCount);
          wsRetryCount++;
          showToast(`追蹤連線中斷，${(delay/1000).toFixed(1)}s 後重試...`);
          wsRetryTimer = setTimeout(() => connectWS(cameraId), delay);
        } else {
          showToast('追蹤連線失敗，請重新整理頁面', 8000);
        }
      };

      ws.onerror = () => {
        // onerror 後必定會觸發 onclose，交給 onclose 處理
      };
    }

    // ── Canvas overlay ────────────────────────────────────────
    function getBoxColor() {
      return currentType === 'thermal' ? '#ff8c42' : '#22bb77';
    }

    function drawBoxes() {
      updateTransport();
      const canvas = document.getElementById('overlay');
      const elW = video.offsetWidth  || 1;
      const elH = video.offsetHeight || 1;
      if (canvas.width  !== elW) canvas.width  = elW;
      if (canvas.height !== elH) canvas.height = elH;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, elW, elH);
      const vidW = video.videoWidth;
      const vidH = video.videoHeight;

      // In live mode, pick the bbox entry whose timestamp best matches the
      // wall-clock time of the frame actually on screen. Prefer hls.playingDate
      // (derived from the segment's #EXT-X-PROGRAM-DATE-TIME) — it travels with
      // the media, so network jitter only changes how much is buffered, never
      // which frame a given timestamp maps to. Fall back to (now - hls.latency)
      // only if PDT is unavailable; that estimate misses the server-side
      // pipeline delay (buffer + encode + segmentation) and runs ~3-5s ahead.
      let displayBoxes = latestBoxes;
      if (isLive && bboxHistory.length) {
        let targetTs = null;
        const pd = hls && hls.playingDate;
        if (pd && !isNaN(pd.getTime())) {
          targetTs = pd.getTime() / 1000;
        } else {
          const latency = (hls && hls.latency != null) ? hls.latency : 0;
          if (latency > 1) targetTs = Date.now() / 1000 - latency;
        }
        if (targetTs != null) {
          let best = bboxHistory[bboxHistory.length - 1];
          let bestDist = Infinity;
          for (const entry of bboxHistory) {
            const d = Math.abs(entry.ts - targetTs);
            if (d < bestDist) { bestDist = d; best = entry; }
          }
          displayBoxes = best.boxes;
        }
      }

      if (!vidW || !vidH || !displayBoxes.length) {
        animFrameId = requestAnimationFrame(drawBoxes);
        return;
      }
      const scale   = Math.min(elW / vidW, elH / vidH);
      const renderW = vidW * scale;
      const renderH = vidH * scale;
      const offX = (elW - renderW) / 2;
      const offY = (elH - renderH) / 2;
      const baseColor = getBoxColor();
      ctx.lineWidth = 1.5;
      ctx.font = 'bold 11px "DM Sans", monospace';

      for (const o of displayBoxes) {
        const [x, y, w, h] = o.bbox;
        const px = offX + x * scale;
        const py = offY + y * scale;
        const pw = w * scale;
        const ph = h * scale;
        const anomaly     = anomalyMap[o.object_id];
        const isAnomalous = anomaly && (anomaly.activity_anomaly || anomaly.temp_anomaly);
        const color       = isAnomalous ? '#ff4444' : baseColor;

        ctx.strokeStyle = color;
        ctx.fillStyle   = color;
        roundRect(ctx, px, py, pw, ph, 3);
        ctx.stroke();

        // 豬隻 ID 標籤
        const label = `#${o.object_id}`;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = color;
        ctx.fillRect(px - 0.5, py - 16, tw + 6, 15);
        ctx.fillStyle = '#000';
        ctx.fillText(label, px + 2, py - 4);
        ctx.fillStyle = color;

        // 異常圖示（bbox 左下角）
        if (anomaly) {
          let icons = '';
          if (anomaly.activity_anomaly) icons += '⚠';
          if (anomaly.temp_anomaly)     icons += '🌡';
          if (icons) ctx.fillText(icons, px + 2, py + ph - 2);
        }
      }
      animFrameId = requestAnimationFrame(drawBoxes);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    animFrameId = requestAnimationFrame(drawBoxes);

    // ── HLS stream ────────────────────────────────────────────
    async function loadStream() {
      if (!currentCamera) return;

      // 清理舊的 HLS instance
      if (hls) { hls.destroy(); hls = null; }
      video.src = '';
      setSkeleton(true);
      setStatus('正在連線...');
      connectWS(currentCamera);

      try {
        const res = await fetch(`/stream/${currentCamera}/live?type=${currentType}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { url } = await res.json();

        if (Hls.isSupported()) {
          hls = new Hls({
            // ── 穩定播放（與後端 stable FPS 設計一致） ──
            lowLatencyMode: false,         // 不需要極低延遲
            liveSyncDurationCount: 3,      // buffer 3 個 segment（12s）讓播放更穩
            liveMaxLatencyDurationCount: 20,// 容忍較大延遲 → 使用者可往回拖約 80s 不被拉回
            maxBufferLength: 40,
            maxMaxBufferLength: 80,
            backBufferLength: 90,          // 保留 90s 已播放 buffer（給「回到幾分鐘前」用）
            // ── 網路抖動容忍 ──
            levelLoadingTimeOut: 10000,
            fragLoadingTimeOut: 20000,
            // ── 遇到 stall 時積極追趕 ──
            maxStarvationDelay: 4,
            maxLoadingDelay: 4,
          });

          hls.loadSource(url);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
            setSkeleton(false);
            setStatus('連線中', 'live');
          });

          hls.on(Hls.Events.LEVEL_LOADED, () => {
            // 每次 segment 載入成功就更新一下狀態（讓人知道串流仍在進行）
            if (statusEl.classList.contains('live')) {
              setStatus('連線中', 'live');
            }
          });

          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) {
              setSkeleton(true);
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                setStatus('網路錯誤，嘗試重新載入...', '');
                setTimeout(() => hls && hls.startLoad(), 1500);
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                setStatus('影像錯誤，嘗試修復...', '');
                hls.recoverMediaError();
              } else {
                setStatus(`串流錯誤：${data.details}`, 'error');
              }
            }
          });

          // video 恢復播放後隱藏 skeleton
          video.addEventListener('playing', () => setSkeleton(false), { once: false });
          video.addEventListener('waiting', () => setSkeleton(true),   { once: false });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Safari native HLS
          video.src = url;
          video.play().catch(() => {});
          setSkeleton(false);
          setStatus('連線中', 'live');
        } else {
          setSkeleton(false);
          setStatus('瀏覽器不支援 HLS', 'error');
        }
      } catch (e) {
        setSkeleton(false);
        setStatus(`無法取得串流：${e.message}`, 'error');
      }
    }

    // ── Transport / scrubber bar ──────────────────────────────
    function fmtClock(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      sec = Math.floor(sec);
      const m = Math.floor(sec / 60), s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Range over which the user may scrub, expressed in *video time*.
    function getSeekRange() {
      let start = 0, end = 0;
      if (!isLive && isFinite(video.duration) && video.duration > 0) {
        start = 0; end = video.duration;
      } else if (video.seekable && video.seekable.length) {
        start = video.seekable.start(0);
        end   = video.seekable.end(video.seekable.length - 1);
      } else if (isFinite(video.duration) && video.duration > 0) {
        end = video.duration;
      }
      const hi = end > start ? end : Infinity;
      const cur = Math.min(Math.max(video.currentTime || 0, start), hi);
      return { start, end, cur };
    }

    function updateTransport() {
      if (!transportEl) return;
      playBtn.textContent = video.paused ? '▶' : '⏸';
      const { start, end, cur } = getSeekRange();
      const span = Math.max(end - start, 0.001);
      const frac = transportDragging ? dragFrac : (cur - start) / span;
      const cf   = Math.min(Math.max(frac, 0), 1);
      const pct  = (cf * 100) + '%';
      seekProgress.style.width = pct;
      seekHandle.style.left    = pct;

      let bEnd = start;
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= cur + 0.25 && video.buffered.end(i) >= cur - 0.25) {
          bEnd = Math.max(bEnd, video.buffered.end(i));
        }
      }
      seekBuffered.style.width = (Math.min(Math.max((bEnd - start) / span, 0), 1) * 100) + '%';
      seekTrack.setAttribute('aria-valuenow', String(Math.round(cf * 100)));

      transportEl.classList.toggle('is-vod', !isLive);

      if (!isLive) {
        timeCurEl.textContent = fmtClock(cur - start);
        timeDurEl.textContent = fmtClock(span);
        timeCurEl.title = new Date((vodStartTs + cur) * 1000).toLocaleString('zh-TW');
        liveBtnT.dataset.state = 'vod';
        liveLabelT.textContent = '即時串流';
      } else {
        const ideal  = (hls && isFinite(hls.liveSyncPosition)) ? hls.liveSyncPosition : end;
        const behind = Math.max(ideal - cur, 0);
        if (behind > 4) {
          timeCurEl.textContent = '-' + fmtClock(behind);
          timeDurEl.textContent = 'LIVE';
          timeCurEl.title = '已往回 ' + fmtClock(behind);
          liveBtnT.dataset.state = 'behind';
          liveLabelT.textContent = '回到即時';
        } else {
          timeCurEl.textContent = 'LIVE';
          timeDurEl.textContent = 'LIVE';
          timeCurEl.title = '';
          liveBtnT.dataset.state = 'at-edge';
          liveLabelT.textContent = 'LIVE';
        }
      }
    }

    function seekToFraction(frac) {
      frac = Math.min(Math.max(frac, 0), 1);
      const { start, end } = getSeekRange();
      if (end <= start) return;
      let target = start + frac * (end - start);
      // Avoid seeking to the exact live edge — it stalls; back off ~0.5s.
      if (isLive && end - target < 1) target = Math.max(start, end - 0.5);
      try { video.currentTime = target; } catch (_) {}
      scheduleTrackingFetch(true);
    }

    function commitDragSeek() {
      if (seekCommitTimer) { dragSeekPending = true; return; }
      seekToFraction(dragFrac);
      seekCommitTimer = setTimeout(() => {
        seekCommitTimer = null;
        if (dragSeekPending) { dragSeekPending = false; commitDragSeek(); }
      }, 150);
    }

    function fracFromEvent(ev) {
      const rect = seekTrack.getBoundingClientRect();
      const clientX = ev.clientX != null ? ev.clientX
        : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : rect.left);
      return Math.min(Math.max((clientX - rect.left) / Math.max(rect.width, 1), 0), 1);
    }

    seekTrack.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      transportDragging = true;
      seekTrack.classList.add('dragging');
      try { seekTrack.setPointerCapture(ev.pointerId); } catch (_) {}
      dragFrac = fracFromEvent(ev);
      commitDragSeek();
    });
    seekTrack.addEventListener('pointermove', (ev) => {
      if (!transportDragging) return;
      dragFrac = fracFromEvent(ev);
      commitDragSeek();
    });
    function endTransportDrag() {
      if (!transportDragging) return;
      transportDragging = false;
      seekTrack.classList.remove('dragging');
      clearTimeout(seekCommitTimer); seekCommitTimer = null; dragSeekPending = false;
      seekToFraction(dragFrac);
    }
    seekTrack.addEventListener('pointerup', endTransportDrag);
    seekTrack.addEventListener('pointercancel', endTransportDrag);
    seekTrack.addEventListener('lostpointercapture', endTransportDrag);

    seekTrack.addEventListener('keydown', (ev) => {
      const { start, end, cur } = getSeekRange();
      const span = Math.max(end - start, 0.001);
      if      (ev.key === 'ArrowLeft')  seekToFraction(((cur - start) - 5) / span);
      else if (ev.key === 'ArrowRight') seekToFraction(((cur - start) + 5) / span);
      else if (ev.key === 'Home')       seekToFraction(0);
      else if (ev.key === 'End')        seekToFraction(1);
      else return;
      ev.preventDefault();
    });

    playBtn.addEventListener('click', () => {
      if (video.paused) video.play().catch(() => {}); else video.pause();
    });

    function goToLiveEdge() {
      if (hls && isFinite(hls.liveSyncPosition)) {
        try { video.currentTime = hls.liveSyncPosition; } catch (_) {}
      } else if (video.seekable && video.seekable.length) {
        try { video.currentTime = video.seekable.end(video.seekable.length - 1) - 0.5; } catch (_) {}
      }
      video.play().catch(() => {});
    }

    function onLiveBtnClick() {
      if (!isLive) { switchToLive(); return; }
      goToLiveEdge();
    }

    // ── Init ──────────────────────────────────────────────────
    async function init() {
      try {
        const res = await fetch('/cameras');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { cameras } = await res.json();
        if (cameras.length === 0) throw new Error('no cameras');

        cameras.forEach(cam => {
          const opt = document.createElement('option');
          opt.value = cam;
          opt.textContent = cam;
          camSelect.appendChild(opt);
        });

        currentCamera = cameras[0];
        loadStream();
        currentWeekStart = getWeekStart(new Date());
        updateWeekNavButtons();
        loadTimeline();
        liveAnomalyIntervalId = setInterval(refreshAnomalyMap, 30000);
        refreshAnomalyMap();
        refreshNotifications();
        loadSettings();
      } catch (e) {
        setSkeleton(false);
        setStatus(`無法取得 camera 清單：${e.message}`, 'error');
      }
    }

    camSelect.addEventListener('change', () => {
      currentCamera = camSelect.value;
      clearInterval(liveAnomalyIntervalId);
      anomalyMap = {};
      vodAlerts  = [];
      currentObjectIds.clear();
      wsRetryCount = 0;
      latestBoxes = [];
      bboxHistory = [];
      countBadge.textContent = '—';
      if (!isLive) {
        isLive = true;
        liveBtn.style.display = 'none';
        detachVodListeners();
        clearTimeout(vodDebounceTimer);
        clearTimeout(trackingFetchTimer);
        trackingCache.clear();
        document.querySelectorAll('.timeline-slot.selected')
          .forEach(s => s.classList.remove('selected'));
      }
      loadStream();
      loadTimeline();
      liveAnomalyIntervalId = setInterval(refreshAnomalyMap, 30000);
      refreshAnomalyMap();
      refreshNotifications();
    });

    init();
  </script>
</body>
</html>
